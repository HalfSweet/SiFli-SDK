# ptab v3 - Partition Table
# Board: sf32lb52-nano_a128r16
# Chip: SF32LB52

version: 3
chip: SF32LB52

partitions:
  # Flash Table (ftab)
  - name: ftab
    type: ftab
    region: mpi2
    offset: 0
    size: 128KB

  # Bootloader
  - name: bootloader
    type: bootloader
    region: mpi2
    offset: 0x80000
    size: 64KB
    core: HCPU

  # Main application
  - name: main
    type: app
    subtype: factory
    region: mpi2
    offset: 0xA0000
    size: 4MB
    core: HCPU

  # DFU application
  - name: dfu
    type: app
    subtype: dfu
    region: mpi2
    offset: 0x4A0000
    size: 512KB
    core: HCPU

  # DFU info region
  - name: dfu_info
    type: data
    subtype: nvds
    region: mpi2
    offset: 0x520000
    size: 128KB

  # DFU download region
  - name: dfu_download
    type: data
    subtype: nvds
    region: mpi2
    offset: 0x780000
    size: 1152KB

  # Filesystem region
  - name: fs
    type: data
    subtype: filesystem
    region: mpi2
    offset: 0x8A0000
    size: 4MB

  # KVDB for DFU
  - name: kvdb_dfu
    type: data
    subtype: nvds
    region: mpi2
    offset: 0xCA0000
    size: 16KB

  # KVDB for BLE
  - name: kvdb_ble
    type: data
    subtype: nvds
    region: mpi2
    offset: 0xCA4000
    size: 16KB

  # PSRAM data region
  - name: psram_data
    type: data
    subtype: ram
    region: psram1
    offset: 0x400000
    size: 4MB

  # HCPU RAM data (shared with bootloader exec)
  - name: hcpu_ram
    type: data
    subtype: ram
    region: hpsys_ram
    offset: 0
    size: 128KB

  # Bootloader RAM data
  - name: bootloader_ram
    type: data
    subtype: ram
    region: hpsys_ram
    offset: 0x40000
    size: 64KB

  # LPSYS RAM
  - name: lpsys
    type: data
    subtype: ram
    region: lpsys_ram
    offset: 0
    size: 24KB

  # Accelerate region (required when exec_region is used)
  - name: accelerate
    type: app
    subtype: accelerate
    region: psram1
    offset: 0
    size: 4MB
